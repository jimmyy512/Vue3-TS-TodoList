services:
  vue3-todo-list:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: vue3-todo-list:latest # 为镜像指定一个名称
    ports:
      - "127.0.0.1:3102:80" # 只給本機除錯用；正式流量走 MainNginx 反代
      - "127.0.0.1:3103:3087" # 只給本機除錯用；正式流量走 MainNginx 反代
    volumes:
      - ./var/log/nginx:/var/log/nginx
    networks:
      - main-network
networks:
  main-network:
    external: true
